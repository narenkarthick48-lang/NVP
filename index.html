<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#07111f">
  <meta name="description" content="NVP AI — your intelligent AI workspace.">
  <title>NVP AI</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar" aria-label="Main sidebar">
      <div class="brand">
        <div class="logo" aria-hidden="true">N</div>
        <span>NVP <b>AI</b></span>
        <button class="close-sidebar" id="closeSidebar" type="button" aria-label="Close sidebar">×</button>
      </div>

      <button class="new-chat" id="newChat" type="button">
        <span aria-hidden="true">＋</span> New chat
      </button>

      <div class="side-menu">
        <button type="button" id="searchChats">⌕ <span>Search chats</span></button>
        <button type="button" id="exploreAI">✧ <span>Explore AI</span></button>
      </div>

      <div class="history-title">YOUR HISTORY</div>
      <div class="chat-history" id="chatHistory">
        <p class="empty-history">Your conversations appear here</p>
      </div>

      <div class="sidebar-bottom">
        <div class="profile">
          <div class="avatar" aria-hidden="true">N</div>
          <div class="profile-copy">
            <strong>NVP User</strong>
            <small>Free plan</small>
          </div>
          <button class="settings-icon" id="settingsBtn" type="button" aria-label="Settings">⚙</button>
        </div>
      </div>
    </aside>

    <main class="main">
      <header class="topbar">
        <button class="menu-btn" id="menuBtn" type="button" aria-label="Open menu">☰</button>
        <div class="mobile-brand"><span class="mobile-brand-mark">N</span> NVP <b>AI</b></div>
        <div class="topbar-spacer"></div>
        <button class="share-btn" id="newChatTop" type="button">＋ <span>New chat</span></button>
      </header>

      <section class="welcome" id="welcome">
        <div class="welcome-eyebrow"><span class="status-dot"></span> YOUR AI WORKSPACE</div>
        <div class="welcome-logo" aria-hidden="true">N</div>
        <h1>What can I help with?</h1>
        <p>Think, create, learn and solve — all in one intelligent workspace.</p>

        <div class="suggestions">
          <button class="suggestion" type="button" data-prompt="Explain artificial intelligence in simple terms">
            <span class="suggestion-icon">✧</span>
            <span class="suggestion-copy"><strong>Learn something</strong><small>Explore ideas and understand new topics</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
          <button class="suggestion" type="button" data-prompt="Help me write a professional email">
            <span class="suggestion-icon">✎</span>
            <span class="suggestion-copy"><strong>Write anything</strong><small>Emails, content and documents</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
          <button class="suggestion" type="button" data-prompt="Help me build a website using HTML CSS and JavaScript">
            <span class="suggestion-icon">⌘</span>
            <span class="suggestion-copy"><strong>Write code</strong><small>Build, debug and improve projects</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
          <button class="suggestion" type="button" data-prompt="Give me some innovative business ideas">
            <span class="suggestion-icon">◇</span>
            <span class="suggestion-copy"><strong>Explore ideas</strong><small>Discover possibilities and plan ahead</small></span>
            <span class="suggestion-arrow">↗</span>
          </button>
        </div>
      </section>

      <section class="conversation" id="conversation" aria-live="polite" aria-label="Conversation"></section>

      <footer class="composer-area">
        <div class="composer">
          <button class="attach-btn" id="attachBtn" type="button" title="Attach file" aria-label="Attach file">＋</button>
          <input type="file" id="fileInput" hidden>
          <select id="modelSelect" aria-label="Select AI model">
            <option value="auto">✧ Auto</option>
            <option value="gemini">Gemini</option>
            <option value="nvidia">NVIDIA</option>
            <option value="groq">Groq</option>
            <option value="openrouter">OpenRouter</option>
            <option value="deepseek">DeepSeek</option>
            <option value="mistral">Mistral</option>
          </select>
          <textarea id="messageInput" placeholder="Message NVP AI..." rows="1" aria-label="Message NVP AI"></textarea>
          <button class="send-btn" id="sendBtn" type="button" title="Send message" aria-label="Send message">↑</button>
        </div>
        <div class="composer-bottom">
          <span>✧ Powered by AI models</span>
          <span>AI can make mistakes. Verify important information.</span>
        </div>
      </footer>
    </main>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop"></div>
  <script src="./app.js"></script>
</body>
</html>
