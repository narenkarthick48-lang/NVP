<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#101010">
<title>NVP AI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">

</head>
<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar" id="sidebar">

    <div class="brand">
      <div class="logo">N</div>
      <span>NVP <b>AI</b></span>
      <button class="close-sidebar" id="closeSidebar">×</button>
    </div>

    <button class="new-chat" id="newChat">
      <span>＋</span> New chat
    </button>

    <div class="side-menu">
      <button>⌕ <span>Search chats</span></button>
      <button>✧ <span>Explore AI</span></button>
    </div>

    <div class="history-title">RECENT</div>

    <div class="chat-history" id="chatHistory">
      <p class="empty-history">Your conversations appear here</p>
    </div>

    <div class="sidebar-bottom">
      <div class="profile">
        <div class="avatar">N</div>
        <div>
          <strong>NVP User</strong>
          <small>Free plan</small>
        </div>
        <span class="settings-icon">⚙</span>
      </div>
    </div>

  </aside>

  <!-- MAIN -->
  <main class="main">

    <header class="topbar">
      <button class="menu-btn" id="menuBtn">☰</button>

      <div class="mobile-brand">NVP AI</div>

      <button class="share-btn" id="newChatTop">＋ New chat</button>
    </header>

    <!-- WELCOME -->
    <section class="welcome" id="welcome">

      <div class="welcome-logo">N</div>

      <h1>What can I help with?</h1>

      <p>Your AI workspace. One place, multiple intelligent models.</p>

      <div class="suggestions">

        <button class="suggestion" data-prompt="Explain artificial intelligence in simple terms">
          <span>✧</span>
          <div>
            <strong>Learn something</strong>
            <small>Explore new ideas and topics</small>
          </div>
        </button>

        <button class="suggestion" data-prompt="Help me write a professional email">
          <span>✎</span>
          <div>
            <strong>Write anything</strong>
            <small>Emails, content and documents</small>
          </div>
        </button>

        <button class="suggestion" data-prompt="Help me build a website using HTML CSS and JavaScript">
          <span>⌘</span>
          <div>
            <strong>Write code</strong>
            <small>Build and debug applications</small>
          </div>
        </button>

        <button class="suggestion" data-prompt="Give me some innovative business ideas">
          <span>◈</span>
          <div>
            <strong>Explore ideas</strong>
            <small>Discover something new</small>
          </div>
        </button>

      </div>
    </section>

    <!-- MESSAGES -->
    <section class="conversation" id="conversation"></section>

    <!-- COMPOSER -->
    <footer class="composer-area">

      <div class="composer">

        <button class="attach-btn" id="attachBtn" title="Attach file">＋</button>

        <input type="file" id="fileInput" hidden>

        <select id="modelSelect" aria-label="Select AI model">
          <option value="auto">✧ Free AI</option>
          <option value="gemini">Gemini</option>
          <option value="nvidia">NVIDIA</option>
          <option value="groq">Groq</option>
          <option value="openrouter">OpenRouter</option>
          <option value="deepseek">DeepSeek</option>
          <option value="mistral">Mistral</option>
        </select>

        <textarea
          id="messageInput"
          placeholder="Message NVP AI..."
          rows="1"
        ></textarea>

        <button class="send-btn" id="sendBtn" title="Send message">
          ↑
        </button>

      </div>

      <div class="composer-bottom">
        <span>✧ Powered by multiple AI models</span>
        <span>AI can make mistakes. Verify important information.</span>
      </div>

    </footer>

  </main>
</div>

<script src="app.js"></script>

</body>
</html>
